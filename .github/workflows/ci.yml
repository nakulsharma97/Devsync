name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JWT_SECRET: ${{ secrets.JWT_SECRET || 'devsync-ci-test-secret-key-that-is-at-least-32-bytes' }}

jobs:
  auth-unit-tests:
    name: Auth Unit Tests (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run auth unit tests
        run: |
          cd backend
          mvn test -B -Dtest="**/auth/*Test,!**/auth/*IntegrationTest" -pl .

      - name: Publish auth test results
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Auth Unit Tests
          path: backend/target/surefire-reports/TEST-com.devsync.auth.*.xml
          reporter: java-junit

  backend-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: auth-unit-tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: devsync_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Backend compile & verify (with MySQL)
        run: |
          cd backend
          mvn clean verify -B -Pcoverage
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/devsync_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: password
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 14

      - name: Publish all test results
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Backend Integration Tests
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: cd frontend && bun install --frozen-lockfile

      - name: TypeScript check
        run: cd frontend && bun tsc -b --noEmit

      - name: Lint
        run: cd frontend && bun run lint

      - name: Unit tests
        run: cd frontend && bun run test

      - name: Build
        run: cd frontend && bun run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    # CI-only values so `docker compose config` can interpolate the required
    # variables in docker-compose.yml (MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD,
    # JWT_SECRET). These are fake test credentials — never used for
    # production, where secrets come from the deployment environment. The
    # backend-tests job is unaffected: it provisions its own MySQL service
    # container with its own credentials.
    env:
      MYSQL_ROOT_PASSWORD: devsync-ci-root-password
      MYSQL_PASSWORD: devsync-ci-mysql-password

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate docker-compose config
        run: docker compose config --quiet

      - name: Build backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: devsync-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: devsync-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
