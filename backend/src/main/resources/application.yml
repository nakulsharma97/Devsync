server:
  port: 8080

spring:
  application:
    name: devsync-backend

  datasource:
    # Profile-neutral. Production overrides these via SPRING_DATASOURCE_* env vars
    # (the `prod` profile has NO defaults and fails fast when any are missing).
    # Local defaults match a standard dev MySQL: schema `dev`, user `root`, password `12345`.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:12345}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        # No explicit dialect: Hibernate auto-detects it from the JDBC connection
        # (MySQLDialect for dev/prod MySQL; the `test` profile uses H2 locally and
        # MySQL in CI, so a hardcoded dialect would break one of the two).
        format_sql: true
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC

app:
  jwt:
    # Local-development fallback so a plain `mvn spring-boot:run` starts out of
    # the box with the `dev` MySQL defaults above. Production is unaffected: the
    # `prod` profile declares JWT_SECRET without a default (fail-fast) and
    # ProductionConfigValidator rejects this known development value there.
    secret: ${JWT_SECRET:devsync-local-development-only-secret-not-for-production}
    # Short-lived access tokens: 15 minutes. A stolen access token is only usable
    # briefly; refresh happens through the rotating HttpOnly cookie.
    expiration-ms: ${DEVSYNC_JWT_ACCESS_EXPIRATION_MS:900000}
    # Refresh tokens live 30 days and rotate on every use.
    refresh-expiration-ms: ${DEVSYNC_JWT_REFRESH_EXPIRATION_MS:2592000000}

  auth:
    # Set true (DEVSYNC_COOKIE_SECURE=true) behind HTTPS in production.
    cookie-secure: ${DEVSYNC_COOKIE_SECURE:false}

  otp:
    expiration-minutes: 10

  account-token:
    # Single-use password-reset / email-verification tokens.
    expiration-minutes: ${DEVSYNC_ACCOUNT_TOKEN_EXPIRATION_MINUTES:15}
    # Where reset/verify links in emails point (e.g. https://app.example.com).
    # Same origin as the frontend; only the link target, never a secret.
    frontend-url: ${FRONTEND_URL:http://localhost:5173}

  admin:
    # Opt-in bootstrap admin seeding. Disabled by default - production must set
    # DEVSYNC_ADMIN_SEED_ENABLED=true AND provide both credentials below.
    # There are intentionally NO default credentials.
    seed-enabled: ${DEVSYNC_ADMIN_SEED_ENABLED:false}
    seed-email: ${DEVSYNC_ADMIN_EMAIL:}
    seed-password: ${DEVSYNC_ADMIN_PASSWORD:}

  cors:
    allowed-origins: ${DEVSYNC_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

  rate-limit:
    # Only set to true behind a reverse proxy you control (nginx, cloud LB).
    trust-x-forwarded-for: ${DEVSYNC_TRUST_X_FORWARDED_FOR:false}
    # Invitation / join-request / join spam protection: max POSTs per minute
    # per user (or per IP when unauthenticated).
    invite:
      per-minute: ${DEVSYNC_RATE_LIMIT_INVITE_PER_MINUTE:10}
    # WebSocket/STOMP traffic (chat, typing, presence, subscriptions). In-memory
    # per-user buckets — single-instance only; move to Redis when scaling out.
    ws:
      enabled: ${DEVSYNC_WS_RATE_LIMIT_ENABLED:true}
      max-messages-per-minute: ${DEVSYNC_WS_RATE_LIMIT_MAX_MESSAGES:120}
      max-subscriptions-per-minute: ${DEVSYNC_WS_RATE_LIMIT_MAX_SUBSCRIPTIONS:30}

  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-size: ${UPLOAD_MAX_SIZE:10485760}

  billing:
    currency: ${DEVSYNC_BILLING_CURRENCY:INR}
    razorpay:
      # Razorpay credentials come only from the environment (never committed).
      # Empty by default so local dev runs without touching payments; checkout
      # returns 503 "Payment not configured" until they are set. In production
      # the prod profile requires all three (fail-fast).
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com}

  github:
    # GitHub OAuth App used for the integration flow (same app as login is fine).
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/github/callback}
    # Where the browser lands after connect: /settings?github=connected
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    # Optional: secret for GitHub webhook signature verification (X-Hub-Signature-256).
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    # Token encryption key. Falls back to JWT_SECRET when unset; refuses to store
    # tokens if neither is configured.
    token-encryption-key: ${GITHUB_TOKEN_ENCRYPTION_KEY:}
    api-timeout-ms: 10000

management:
  endpoints:
    web:
      exposure:
        # Only health and info are exposed publicly; everything else stays internal.
        include: health,info
  endpoint:
    health:
      # Never leak database/user details through the public health endpoint.
      show-details: never
  health:
    mail:
      # SMTP is optional (MAIL_USERNAME/MAIL_PASSWORD may be unset). Without this,
      # an unconfigured mail server drags the whole health endpoint to DOWN/503.
      enabled: ${MAIL_HEALTH_ENABLED:false}

logging:
  level:
    # INFO by default. DEBUG is noisy and can leak request/response details;
    # enable explicitly in dev only via LOG_LEVEL_DEV_SYNC=DEBUG.
    com.devsync: ${LOG_LEVEL_DEV_SYNC:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
