server:
  port: 8080

spring:
  application:
    name: devsync-backend

  datasource:
    url: jdbc:mysql://localhost:3306/devsync_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
    refresh-expiration-ms: 2592000000

  otp:
    expiration-minutes: 10

  admin:
    seed-email: ${ADMIN_SEED_EMAIL:admin@devsync.com}
    seed-password: ${ADMIN_SEED_PASSWORD:Admin@123}

  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-size: ${UPLOAD_MAX_SIZE:10485760}

logging:
  level:
    com.devsync: DEBUG
    org.springframework.security: INFO
