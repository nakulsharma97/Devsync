# Production profile — run with SPRING_PROFILES_ACTIVE=prod (or leave the
# profile unset and provide the same environment variables).
#
# There are intentionally NO secret defaults here. Every required secret is an
# environment placeholder WITHOUT a default, so a missing variable fails startup
# immediately (placeholder resolution error) instead of silently using an
# unsafe value.
#
# Required (fail-fast if missing):
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#   JWT_SECRET                       (256-bit+, openssl rand -base64 64)
#
# Strongly recommended:
#   DEVSYNC_COOKIE_SECURE=true       (default here: true — HTTPS terminates at the proxy)
#   DEVSYNC_CORS_ORIGINS             (your real frontend origin)
#   FRONTEND_URL                     (origin used in reset/verify email links)
#   MAIL_USERNAME / MAIL_PASSWORD    (SMTP — both together or neither)
#   GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET / GITHUB_REDIRECT_URI / GITHUB_WEBHOOK_SECRET
#   RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET / RAZORPAY_WEBHOOK_SECRET (fail-fast below)
#
# Additionally, ProductionConfigValidator (active only in this profile) aborts
# startup when a known development fallback value (e.g. the dev JWT secret or
# the local MySQL password "12345") is detected, when SMTP credentials are half-
# configured, or when admin seeding is enabled without credentials. Values are
# never logged — only the names of the offending variables.

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

server:
  # nginx already sets X-Forwarded-Proto; honor it so request.isSecure() is true
  # behind the TLS-terminating proxy. Required for Strict-Transport-Security to
  # be emitted (Spring only writes it on secure requests).
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET}
  billing:
    # Fail-fast: production cannot boot without Razorpay credentials.
    razorpay:
      key-id: ${RAZORPAY_KEY_ID}
      key-secret: ${RAZORPAY_KEY_SECRET}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
  auth:
    # HTTPS terminates at the reverse proxy (nginx/cloud LB) — the refresh-token
    # cookie must be Secure so it is never sent over plain HTTP.
    cookie-secure: ${DEVSYNC_COOKIE_SECURE:true}
  security:
    # Strict-Transport-Security is HTTPS-only. Enabled here because the prod
    # deployment is always served over HTTPS (nginx/LB); never enable it for
    # plain-HTTP deployments or browsers will refuse to connect.
    hsts: true

logging:
  level:
    # INFO by default. DEBUG is noisy and can leak request/response details.
    com.devsync: ${LOG_LEVEL_DEV_SYNC:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
