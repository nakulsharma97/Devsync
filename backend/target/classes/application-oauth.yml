# OAuth2 Provider Configuration
# Rename this file to application.yml and merge with your main config,
# or set SPRING_PROFILES_ACTIVE=oauth when running.
#
# To use OAuth login:
# 1. Create GitHub OAuth App: https://github.com/settings/developers
#    - Homepage URL: http://localhost:5173
#    - Callback URL: http://localhost:8080/login/oauth2/code/github
#
# 2. Create Google OAuth App: https://console.cloud.google.com/apis/credentials
#    - Authorized redirect URI: http://localhost:8080/login/oauth2/code/google
#
# 3. Set environment variables before starting:
#    export GITHUB_CLIENT_ID=your_github_client_id
#    export GITHUB_CLIENT_SECRET=your_github_client_secret
#    export GOOGLE_CLIENT_ID=your_google_client_id
#    export GOOGLE_CLIENT_SECRET=your_google_client_secret

spring:
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: user:email,read:user

          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email,profile
