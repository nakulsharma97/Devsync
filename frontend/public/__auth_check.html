<!doctype html>
<html>
<head><meta charset="utf-8"><title>auth layout check</title></head>
<body>
<script>
  const widths = [1024, 1280, 1440, 1920];
  const results = [];
  let i = 0;
  const iframe = document.createElement('iframe');
  iframe.style.height = '1000px';
  document.body.appendChild(iframe);

  function run() {
    const w = widths[i];
    if (w === undefined) { document.title = 'DONE'; document.body.textContent = JSON.stringify(results); return; }
    iframe.style.width = w + 'px';
    iframe.src = '/auth';
    const t0 = Date.now();
    const check = setInterval(() => {
      const doc = iframe.contentDocument;
      if (!doc) return;
      const t = Date.now() - t0;
      const brand = doc.querySelector('.lg\\:flex button');
      const badge = doc.querySelector('.rounded-full.bg-indigo-500\\/15');
      const heading = doc.querySelector('h2');
      const desc = doc.querySelector('h2 + p');
      if (brand && heading && t > 2500) {
        clearInterval(check);
        const top = (el) => Math.round(el.getBoundingClientRect().top);
        const bottom = (el) => Math.round(el.getBoundingClientRect().bottom);
        results.push({
          w,
          brand: [top(brand), bottom(brand)],
          badge: [top(badge), bottom(badge)],
          heading: [top(heading), bottom(heading)],
          desc: [top(desc), bottom(desc)],
          overlap: bottom(brand) > top(heading) || bottom(badge) > top(heading),
          order: top(brand) < top(badge) && top(badge) < top(heading) && top(heading) < top(desc),
          docHscroll: doc.documentElement.scrollWidth > doc.documentElement.clientWidth,
        });
        i++;
        setTimeout(run, 600);
      } else if (t > 12000) {
        clearInterval(check);
        results.push({ w, error: 'timeout', href: iframe.contentWindow.location.href });
        i++;
        setTimeout(run, 400);
      }
    }, 400);
  }
  run();
</script>
</body>
</html>
