# DevSync production stack
#
# Required env vars (set in .env or the shell):
#   MYSQL_ROOT_PASSWORD   root password for the MySQL container (never commit)
#   MYSQL_PASSWORD        password for the dedicated `devsync` DB user
#   JWT_SECRET            256-bit+ secret for signing JWTs (openssl rand -base64 64)
#   RAZORPAY_KEY_ID       Razorpay API key        (test mode: rzp_test_*)
#   RAZORPAY_KEY_SECRET   Razorpay API secret
#   RAZORPAY_WEBHOOK_SECRET  verifies X-Razorpay-Signature on webhooks
#
# Optional:
#   DEVSYNC_ADMIN_SEED_ENABLED / DEVSYNC_ADMIN_EMAIL / DEVSYNC_ADMIN_PASSWORD
#   MAIL_USERNAME / MAIL_PASSWORD
#   DEVSYNC_CORS_ORIGINS   (defaults to localhost origins)
#
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: devsync_db
      # The application connects with this dedicated user — never root.
      MYSQL_USER: devsync
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    # TLS between backend and MySQL. Generate the certificates first:
    #   ./scripts/generate-db-certs.sh
    # Mounted read-only; the CA key never leaves the host.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --ssl-ca=/etc/mysql/certs/ca.pem
      - --ssl-cert=/etc/mysql/certs/server-cert.pem
      - --ssl-key=/etc/mysql/certs/server-key.pem
    volumes:
      - mysql_data:/var/lib/mysql
      - ./certs:/etc/mysql/certs:ro
    networks:
      - devsync-net
    # Do not publish MySQL to the host in production. Uncomment for local dev:
    # ports:
    #   - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Production profile: required secrets come from the environment (no
      # defaults) and ProductionConfigValidator fails startup if a known
      # development fallback value is detected.
      SPRING_PROFILES_ACTIVE: prod
      # TLS to MySQL: VERIFY_CA against the generated CA (see scripts/generate-db-certs.sh).
      # For a local non-TLS MySQL, override with:
      #   SPRING_DATASOURCE_URL="jdbc:mysql://localhost:3306/devsync_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      # trustCertificateKeyStoreType must be declared: Connector/J defaults to
      # JKS, so without it the driver tries to read the PKCS12 truststore as JKS
      # and the backend dies with "Could not load trustJKS keystore".
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/devsync_db?useSSL=true&sslMode=VERIFY_CA&trustCertificateKeyStoreUrl=file:/certs/backend-truststore.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=changeit&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: devsync
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DEVSYNC_JWT_ACCESS_EXPIRATION_MS: ${DEVSYNC_JWT_ACCESS_EXPIRATION_MS:-900000}
      DEVSYNC_JWT_REFRESH_EXPIRATION_MS: ${DEVSYNC_JWT_REFRESH_EXPIRATION_MS:-2592000000}
      # Set true when HTTPS terminates at the reverse proxy — marks the refresh
      # cookie Secure so it is never sent over plain HTTP.
      DEVSYNC_COOKIE_SECURE: ${DEVSYNC_COOKIE_SECURE:-true}
      DEVSYNC_WS_RATE_LIMIT_ENABLED: ${DEVSYNC_WS_RATE_LIMIT_ENABLED:-true}
      DEVSYNC_WS_RATE_LIMIT_MAX_MESSAGES: ${DEVSYNC_WS_RATE_LIMIT_MAX_MESSAGES:-120}
      DEVSYNC_WS_RATE_LIMIT_MAX_SUBSCRIPTIONS: ${DEVSYNC_WS_RATE_LIMIT_MAX_SUBSCRIPTIONS:-30}
      DEVSYNC_CORS_ORIGINS: ${DEVSYNC_CORS_ORIGINS:-http://localhost:80,http://localhost:5173}
      # Behind the nginx reverse proxy, so the rate limiter may trust X-Forwarded-For.
      DEVSYNC_TRUST_X_FORWARDED_FOR: "true"
      UPLOAD_DIR: /app/uploads
      DEVSYNC_ADMIN_SEED_ENABLED: ${DEVSYNC_ADMIN_SEED_ENABLED:-false}
      DEVSYNC_ADMIN_EMAIL: ${DEVSYNC_ADMIN_EMAIL:-}
      DEVSYNC_ADMIN_PASSWORD: ${DEVSYNC_ADMIN_PASSWORD:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8080/api/github/callback}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-}
      # Billing. application-prod.yml declares the Razorpay keys as ${VAR}
      # with NO default (deliberate fail-fast), so they must be supplied here
      # or the prod backend cannot resolve its config and crash-loops on
      # startup. Checkout returns 503 until real keys are set.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?RAZORPAY_KEY_ID is required}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?RAZORPAY_KEY_SECRET is required}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?RAZORPAY_WEBHOOK_SECRET is required}
      RAZORPAY_BASE_URL: ${RAZORPAY_BASE_URL:-https://api.razorpay.com}
      # Stripe is optional (defaults allow an empty value), but it still has to
      # be forwarded or setting it in .env would silently do nothing.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - uploads:/app/uploads
      - ./certs:/certs:ro
    networks:
      - devsync-net
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Same-origin by default (/api + /ws proxied by nginx). Override with
      # absolute URLs if the frontend and API are served from different hosts:
      #   VITE_API_URL=https://api.example.com/api  VITE_WS_URL=wss://api.example.com/ws
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-/ws}
    restart: unless-stopped
    ports:
      - "80:8080"
    networks:
      - devsync-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Redis is NOT required by the current application (rate limiting is in-memory).
  # Add it here when the rate limiter / sessions move to Redis:
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   command: redis-server --appendonly yes
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - devsync-net
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5

volumes:
  mysql_data:
  uploads:
  # redis_data:

networks:
  devsync-net:
    driver: bridge
