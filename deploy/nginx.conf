# DevSync — edge configuration for the single-container Render image.
#
# deploy/start.sh substitutes __PORT__ (Render's PORT) and __BACKEND_PORT__
# (Spring Boot, loopback only) into a copy at /tmp/nginx.conf before nginx starts.
# This file is a template: the placeholders must not be resolved at build time.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Spring allows 10MB per file / 12MB per request; nginx's 1MB default would
    # reject larger uploads before the backend ever sees them.
    client_max_body_size 12m;

    # Non-root nginx cannot write to the package defaults under /var/lib/nginx.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Render terminates TLS and forwards X-Forwarded-Proto: https. Propagating it
    # (instead of resetting it to $scheme) keeps request.isSecure() true in
    # Spring, which is what emits Secure cookies, HSTS and https OAuth redirects.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https   https;
        http    http;
    }

    map $http_x_forwarded_proto $hsts_header {
        default "max-age=0";
        https   "max-age=31536000; includeSubDomains";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    server {
        listen __PORT__;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_header always;
        # The SPA's index.html contains one inline theme bootstrap script; its
        # SHA-256 keeps script-src strict (no 'unsafe-inline'). If that script in
        # frontend/index.html changes, recompute the hash or it will be blocked.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-pFHiupvISgmcfr9qxVUfvxEog7aU8LnQex8kunl1nmU='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https://*.sentry.io https://*.ingest.sentry.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        # ── REST API ───────────────────────────────────────────
        location /api/ {
            proxy_pass http://127.0.0.1:__BACKEND_PORT__;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
        }

        # ── STOMP WebSocket (native /ws, plus /ws/info for SockJS) ──
        # The client connects to /ws without a trailing slash, so a bare prefix
        # is required; "/ws/" alone would fall through to the SPA catch-all.
        location /ws {
            proxy_pass http://127.0.0.1:__BACKEND_PORT__;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Spring Security OAuth2 login (backend endpoints, not SPA routes) ──
        location /oauth2/ {
            proxy_pass http://127.0.0.1:__BACKEND_PORT__;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 90s;
        }

        location /login/ {
            proxy_pass http://127.0.0.1:__BACKEND_PORT__;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 90s;
        }

        # ── Hashed Vite assets: immutable ──────────────────────
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security $hsts_header always;
        }

        # ── SPA routing ────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
            # Locations that set their own add_header do not inherit the
            # server-level ones, and index.html is exactly where CSP matters.
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security $hsts_header always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-pFHiupvISgmcfr9qxVUfvxEog7aU8LnQex8kunl1nmU='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https://*.sentry.io https://*.ingest.sentry.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        }
    }
}
